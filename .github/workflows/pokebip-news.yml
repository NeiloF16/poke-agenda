name: Veille des annonces Pokébip
on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lire le flux RSS public des actualités
        run: node scripts/sync-pokebip-news.mjs
      - name: Publier les nouveautés du cache d'annonces
        run: |
          if git diff --quiet -- assets/calendar/news-watch.json; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "poké-agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/calendar/news-watch.json
          git commit -m "Veille quotidienne : nouveaux titres Pokébip"
          git push
